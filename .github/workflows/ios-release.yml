name: iOS Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bundle exec fastlane ios release

      # Print what actually shipped: the entitlements and the profile's
      # capabilities. Push registration fails silently on the device if
      # aps-environment is missing here.
      - name: Inspect signed app
        if: always()
        run: |
          set -e
          cd build && rm -rf _ipa && mkdir _ipa && cd _ipa && unzip -q ../hapoel-hadera.ipa
          APP=$(ls -d Payload/*.app | head -1)
          echo "== entitlements (signed app) =="; codesign -d --entitlements - --xml "$APP" | plutil -p - || codesign -d --entitlements - "$APP"
          echo "== codesign details =="; codesign -dvvv "$APP" 2>&1 | grep -iE "Identifier|TeamIdentifier|Authority|Format" || true
          echo "== embedded extensions =="; ls -la "$APP/PlugIns" 2>/dev/null || echo "(none)"
          echo "== live activities flag =="; plutil -extract NSSupportsLiveActivities raw -o - "$APP/Info.plist" || echo "(missing)"
          echo "== embedded profile: Entitlements =="; security cms -D -i "$APP/embedded.mobileprovision" | plutil -extract Entitlements xml1 -o - -

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hapoel-hadera-ipa
          path: build/hapoel-hadera.ipa

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            build
